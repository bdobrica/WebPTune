[package]
name = "webp-ssim-optimizer"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A WebP optimizer with a measured SSIMULACRA2 quality floor"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "~4.5", features = ["derive"] }
fast-ssim2 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
same-file = "1"
tempfile = "3"
webp = { version = "0.3", default-features = false }

[dev-dependencies]
png = "0.18"

[[example]]
name = "api_spike"
test = true
