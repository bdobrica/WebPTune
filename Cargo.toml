[package]
name = "webptune"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "A WebP optimizer with a measured SSIMULACRA2 quality floor"
license = "Apache-2.0"
readme = "README.md"
keywords = ["webp", "image", "ssimulacra2", "optimization", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
publish = false

[dependencies]
anyhow = "1"
clap = { version = "~4.5", features = ["derive"] }
ctrlc = { version = "3.5", features = ["termination"] }
fast-ssim2 = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "hdr"] }
moxcms = "0.8.1"
png = "0.18"
same-file = "1"
tempfile = "3"
webp = { version = "0.3", default-features = false }

[[example]]
name = "api_spike"
test = true
